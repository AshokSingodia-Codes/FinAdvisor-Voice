name: FinAdvisor CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Test Backend API & Graph RAG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Backend Tests
        env:
          JWT_SECRET: "ci-test-jwt-secret-key-32-chars-long"
          GROQ_API_KEY: "gsk_dummy_test_key_for_ci_env"
        run: |
          pytest tests/test_auth.py tests/test_verifier.py -v

  frontend-build:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  deploy-render:
    name: Trigger Render Deployment
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering Render deploy webhook..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Deployment triggered successfully on Render!"
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL not set in GitHub Secrets."
            echo "ℹ️ If Render is connected directly to your GitHub repo, it will auto-deploy on push to main."
          fi

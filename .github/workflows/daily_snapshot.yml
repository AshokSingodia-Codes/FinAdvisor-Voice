name: Scheduled Daily Asset Snapshots

on:
  schedule:
    # 4:30 PM IST (11:00 UTC) Mon-Fri: Post-Market Equities
    - cron: '0 11 * * 1-5'
    # 9:30 PM IST (16:00 UTC) Mon-Fri: AMFI Mutual Fund Daily NAVs
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Snapshot Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python scripts/daily_snapshot_job.py

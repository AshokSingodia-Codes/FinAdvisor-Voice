services:
  - type: web
    name: finadvisor-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -c "from fastembed import TextEmbedding; from flashrank import Ranker; import os; os.makedirs('data/.fastembed_cache', exist_ok=True); os.makedirs('.cache/flashrank', exist_ok=True); TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='data/.fastembed_cache', threads=1); Ranker(model_name='ms-marco-MiniLM-L-12-v2', cache_dir='.cache/flashrank')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 30
    envVars:
      - key: EMBEDDING_PROVIDER
        value: "fastembed"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

  - type: cron
    name: finadvisor-daily-snapshots
    env: python
    region: ohio
    plan: free
    schedule: "0 16 * * 1-5"  # Mon-Fri at 9:30 PM IST (16:00 UTC) after daily NAVs and market close
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_snapshot_job.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

